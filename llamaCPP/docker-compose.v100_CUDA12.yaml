# =============================================================================
# llama.cpp server (OpenAI-совместимый API) — NVIDIA V100, 16 GB VRAM, CUDA 12
#
# Общие замечания:
#   * Модели в ./models — 24–35B (17–23 ГБ в Q4/Q5/Q6), они БОЛЬШЕ VRAM V100,
#     поэтому при -ngl 99 модель делится: слои, которые помещаются, уходят в VRAM,
#     остальные считаются на CPU (RAM). Это медленно, но работает.
#   * "Проверенная" конфигурация для Qwen3.8-27B на V100 — в Readme.md
#     (ctx 65536, batch 512, ubatch 256, cache-reuse 256, reasoning off).
#     Значения ниже — более "агрессивный" вариант; при нехватке памяти/ОЗУ
#     откатывайтесь к значениям из Readme.md.
# =============================================================================
services:
  llama:
    # Официальный образ llama.cpp с сервером и сборкой под CUDA 12.
    # Теги: server (CPU), server-cuda12 (CUDA 12.x).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    # Имя контейнера; ${MODEL_NAME} подставляется из .env в папке compose-файла.
    container_name: llama-cpp-cuda_12-v100-${MODEL_NAME}-container
    # restart: always — перезапускать при падении/перезагрузке хоста
    restart: no
    ports:
      # "хост:контейнер". ВНИМАНИЕ: "9722:8080" слушает на ВСЕХ интерфейсах хоста,
      # а не только локально. Только для localhost: "127.0.0.1:9722:8080".
      # 9722 — порт на хосте (можно любой свободный); 8080 — порт внутри контейнера.
      - "9722:8080"     # только локально; уберите 127.0.0.1:, чтобы открыть в сеть
    volumes:
      # Папка с GGUF-моделями -> /models в контейнере; :ro = read-only (только чтение).
      - ./models:/models:ro
    command:
      # -m — путь к GGUF-модели внутри контейнера.
      - "-m"
      - "/models/${MODEL_NAME}.gguf"
      # --host — интерфейс прослушивания ВНУТРИ контейнера.
      # 0.0.0.0 здесь ОБЯЗАТЕЛЕН (иначе docker не пробросит порт наружу).
      - "--host"
      - "0.0.0.0"
      # --port — порт сервиса внутри контейнера; должен совпадать с правой
      # частью mappings в ports (8080).
      - "--port"
      - "8080"
      # --api-key — защищает API ключом (заголовок Authorization: Bearer ...).
      # Рекомендуется, если порт открыт не только на localhost.
      # - "--api-key"
      # - "your_secret_key_here"
      # --ctx-size — размер контекста в токенах (вмещает историю диалога + ответ).
      # По умолчанию 0 = берётся из метаданных модели. Память KV-кэша растёт
      # линейно: для 27B-модели ~150–250 МБ на 1K токенов при q8_0.
      # 131072 (128K) — агрессивно: только если хватает RAM/VRAM.
      # 65536 (64K) — проверено для Qwen3.8-27B на этой V100 (см. Readme.md).
      # 32768 (32K) — безопасный минимум для обычного чата.
      - "--ctx-size"
      # - "262144"
      - "131072"
      # - "65536"
      # - "32768"
      # --n-gpu-layers — то же, что -ngl, но длинной формой. 15 слоёв на GPU —
      # слишком мало для V100 (медленно); используйте -ngl ниже.
      # - "--n-gpu-layers"
      # - "15"
      # --- Спекулятивное декодирование (MTP) ---
      # draft-mtp — черновые токены генерирует сам блок MTP модели (DeepSeek,
      # Qwen3.8 и др.); даёт ускорение 1.5–2x, НО требует модель с MTP-весами
      # (файл "noMTP" его не поддерживает) и ЕЩЁ больше памяти.
      # - "--spec-type draft-mtp"
      # --spec-draft-n-max — сколько черновых токенов принимать за шаг (1–4).
      # - "--spec-draft-n-max"
      # - "2"
      # -ngl — сколько слоёв модели выгрузить в VRAM (99 = "все, что поместятся").
      # Распределение слоев между RAM и VRAM:
      # 99 — максимум скорости; при нехватке VRAM сервер упадёт или будет
      #       подкачивать из RAM (page fault'ы) — уменьшайте до 60/40.
      # 40 — консервативно: меньше VRAM, выше доля CPU (медленнее, но стабильнее).
      - "-ngl"
      - "99"
      # - "40"
      # --cache-type-k / --cache-type-v — тип данных KV-кэша (K и V).
      # f16 (по умолчанию) — максимально точно, но кэш в 2 раза больше.
      # q8_0 — почти без потери качества, кэш в ~2 раза меньше: РЕКОМЕНДУЕТСЯ
      #         для больших ctx на V100. q4_0/q4_1 — ещё меньше памяти, но
      #         заметная деградация на длинном контексте (лучше не использовать).
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      # --keep — сколько первых токенов промпта держать в контексте при переполнении
      # (остальное сдвигается/выбрасывается — "скользящее окно").
      # 512 — разумно: системный промпт и начало истории сохраняются.
      # 0 (по умолчанию) — не сохранять ничего; -1 = всё.
      - "--keep"
      - "512"
      # --batch-size — логический размер батча при обработке промпта (prefill).
      # По умолчанию 2048. Чем больше — тем быстрее prefill, тем больше пик
      # памяти. 1024 — хорошо; 512 — проверено для 27B на V100 (Readme.md).
      - "--batch-size"
      - "1024"
      # - "512"
      # --ubatch-size — физический микробатч (шаг вычисления). По умолчанию 512.
      # Должен быть <= batch-size. 512 — стандарт; 256 — если не хватает памяти.
      - "--ubatch-size"
      - "512"
      # - "256"
      # --threads — потоки CPU при ГЕНЕРАЦИИ (по токену, память узкое место).
      # По умолчанию -1 (авто). Ставьте ~числу ФИЗИЧЕСКИХ ядер; больше —
      # переключение контекстов и просадка. 12 — ок для 12–16 ядер.
      - "--threads"
      - "12"
      # --threads-batch — потоки при обработке БАТЧЕЙ (prefill, вычисления узкое
      # место). По умолчанию = --threads. Можно ставить больше (число логических
      # ядер / SMT), т.к. здесь важна пропускная способность. 16 — ок.
      - "--threads-batch"
      - "16"
      # --parallel — число параллельных слотов (одновременных диалогов).
      # По умолчанию -1 (авто). ВАЖНО: у каждого слота СВОЙ KV-кэш, память
      # растёт линейно: parallel 4 x ctx 128K = x4 к памяти кэша.
      # 1 — для одного пользователя/агента (рекомендуется на V100).
      - "--parallel"
      - "1"
      # --timeout — таймаут чтения/записи HTTP-запроса, сек. По умолчанию 3600.
      # 1800 (30 мин) — достаточно для длинных генераций; увеличивайте только
      # при очень медленных моделях/больших ctx.
      - "--timeout"
      - "1800"
      # --cache-reuse — минимальный размер фрагмента (в токенах), который можно
      # переиспользовать из KV-кэша через сдвиг (KV shifting). По умолчанию 0
      # (выключено). Очень полезно для АГЕНТОВ с длинным повторяющимся системным
      # промптом: повторные запросы не пересчитывают общий префикс.
      # 256 — проверено для Qwen3.8-27B (Readme.md); включите, если агент
      # шлёт одинаковый системный промпт.
      # - "--cache-reuse"
      # - "256"
      # --poll — уровень опроса CPU (0–100) при ожидании работы. По умолчанию 50.
      # Выше = меньше задержка, но выше фоновая загрузка CPU; 0 = спать до события.
      # 50 — разумный баланс.
      - "--poll"
      - "50"
      # --flash-attn — Flash Attention (экономит память и ускоряет attention).
      # ВАЖНО: требует GPU с compute capability >= 8.0 (Ampere/A100/H100...).
      # V100 = Volta (sm_70) — НЕ ПОДДЕРЖИВАЕТСЯ.
      # "auto" (по умолчанию) — безопасное значение: само отключится на V100.
      # "on" — принудительно: на V100 бессмысленно, может дать ошибку/предупреждение.
      - "--flash-attn"
      - "auto"
      # --fit — автоматически подгонять НЕЗАДАННЫЕ аргументы под доступную память
      # (по умолчанию 'on'). 'off' — использовать заданные значения как есть:
      # если не влезут — сервер упадёт при старте (легче поймать ошибку сразу).
      # Для отлаженной конфигурации 'off' допустим; для экспериментов лучше 'on'.
      - "--fit"
      - "off"
      # --reasoning — режим "размышлений" (thinking) для моделей с поддержкой
      # (Qwen3, DeepSeek R1 и др.). 'auto' (по умолчанию) — определяется по
      # шаблону модели. 'on' — включать всегда; 'off' — выключить.
      # Для агентов/быстрых ответов лучше 'off' (экономит токены и время);
      # 'on' + бюджет — если нужна сложная логика.
      - "--reasoning"
      - "on"
      # - "off"
      # --reasoning-budget — лимит токенов на "размышление".
      # -1 (по умолчанию) = без лимита; 0 = думать не давать вовсе; N > 0 — лимит.
      # 2048 — разумный потолок: дальше модель обычно "крутится" без пользы.
      - "--reasoning-budget"
      - "2048"
      # --reasoning-budget-message — сообщение, которое впрыскивается перед
      # закрывающим тегом размышлений, когда бюджет исчерпан (мягко "останавливает"
      # модель). По умолчанию не задано.
      - "--reasoning-budget-message"
      - "I should stop thinking and act now."
      # --no-reasoning-preserve — по умолчанию след размышлений ХРАНИТСЯ во всей
      # истории диалога (нужно некоторым моделям, напр. Z.ai/GLM). С флагом —
      # хранится только в последнем сообщении: ЭКОНОМИТ контекст.
      # Для агентов с длинной историей — рекомендуется оставить.
      - "--no-reasoning-preserve"
      # --ctx-checkpoints — максимум контрольных точек KV-кэша на слот
      # (по умолчанию 32). Точки позволяют "откатывать" кэш при ветвлении/
      # повторе запросов (работает в связке с cache-reuse). 32 — достаточно.
      - "--ctx-checkpoints"
      - "32"
      # --checkpoint-min-step — минимальный интервал между контрольными точками
      # в токенах (по умолчанию 8192; 0 = без минимума). 2048 — точки чаще,
      # выше точность отката, чуть больше памяти. Ок для агентских сценариев.
      - "--checkpoint-min-step"
      - "2048"
      # --cache-ram — максимальный размер KV-кэша в СИСТЕМНОЙ ОЗУ, МБ
      # (по умолчанию 8192; -1 = без лимита). 16384 = 16 ГБ: позволяет держать
      # хвост кэша 128K-контекста в RAM, разгружая VRAM. Ставьте с учетом
      # того, что ОЗУ ещё нужна самой модели (см. -ngl).
      - "--cache-ram"
      - "16384"
      # --jinja — использовать Jinja-шаблон чата из метаданных модели (а не
      # встроенный). ОБЯЗАТЕЛЕН для function calling / tool use и для корректной
      # работы thinking-режима. Оставлять включенным.
      - "--jinja"
      # --repeat-penalty — штраф за повторение последовательностей токенов.
      # 1.0 (по умолчанию) = выключено; >1.0 усиливает.
      # 1.0 — нейтрально; 1.1 — мягкое подавление зацикливаний (использовано в
      # проверенной конфигурации Readme.md). Не ставьте >1.3 — текст деградирует.
      - "--repeat-penalty"
      - "1.0"
      # - "1.1"
      # --presence-penalty — штраф за УПОМИНАНИЕ токена хотя бы раз (диапазон
      # -2..2; по умолчанию 0 = выключено). 0.5 — умеренно распыляет ответ,
      # меньше повторов; >1.0 — текст становится рваным (лучше не использовать).
      - "--presence-penalty"
      # - "0.0"
      - "0.5"
      # --- Контроль генерации (КРИТИЧНО ДЛЯ АГЕНТОВ) ---
      # --temp — температура (случайность) выборки, по умолчанию 0.8.
      # 0.0 — детерминированно (лучше для агентов/JSON/инструментов).
      # 0.6 — баланс "умно и стабильно" (хорошо для чата).
      # 0.1 — почти детерминированно, чуть живее. >1.0 — бессмысленно для агентов.
      - "--temp"
      - "0.6"
      # - "0.1"
      # - "0.0"
      # --top-p — ядерное сэмплирование: брать токены из набора с суммарной
      # вероятностью p (по умолчанию 0.95; 1.0 = выключено).
      # 0.95 — стандарт для чата; 0.9 — чуть строже (в Readme.md); 0.1 — очень
      # жёстко, ответ бедный (только для детерминированных задач).
      - "--top-p"
      - "0.95"
      # - "0.1"
      # - "0.9"
      # --top-k — оставлять только k самых вероятных токенов (по умолчанию 40;
      # 0 = выключено). 20 — стандарт для большинства LLM; больше (40+) почти
      # не меняет качество, но шире хвост. Не ставьте 1 (дегенерация).
      - "--top-k"
      - "20"
      # --min-p — отбрасывать токены с вероятностью < min_p относительно
      # лучшей (по умолчанию 0.05; 0.0 = выключено).
      # 0.0 — выключено: на V100 с ограниченной памятью это допустимо, но хвост
      # "мусорных" токенов остаётся. 0.05 — рекомендуемый минимум для агентов
      # (использован в Readme.md): реже галлюцинации и "мусор".
      - "--min-p"
      - "0.0"
      # - "0.05"
      # - "--flash-attn on"   # на V100 НЕ использовать (sm_70 < sm_80)
      # - no-reasoning-preserve
      # Блокировка модели в RAM: --mlock запрещает ОС выгружать модель в swap —
      # убирает "заикания" при page fault'ах, но сразу резервирует всю ОЗУ.
      # В новых версиях llama.cpp заменён на "--load-mode mlock" (или "mmap+mlock").
      # - "--mlock"
      # --verbose — подробный лог (полезен при отладке: VRAM, скорость, слоты).
      # - "--verbose"
      # --- Стоп-токены (предотвращают бесконечный мусор) ---
      # Каждый --stop останавливает генерацию при появлении строки.
      # Нужны, если модель "додумывает" чужие роли/теги вместо завершения ответа.
      # Для Qwen3.8 с --jinja обычно не требуются (шаблон сам управляет ролями).
      # - "--stop"
      # - "</think>"
      # - "--stop"
      # - "<|user|>"
      # - "--stop"
      # - "<|observation|>"
      # - "--stop"
      # - "<|assistant|>"
      # - "--stop"
      # - "</tool_call>"
    deploy:
      resources:
        reservations:
          devices:
            # Выдать контейнеру GPU через NVIDIA Container Toolkit.
            # driver: nvidia — использовать драйвер NVIDIA на хосте;
            # count: all — все GPU хоста (для одной карты это и есть одна;
            # для выбора конкретной: count: 1 + device_ids: ['0']);
            # capabilities: [gpu] — нужен именно GPU.
            - driver: nvidia
              count: all
              capabilities: [gpu]